# Thematic ETF Goodhart's Law Drift Checks
#
# Every thematic ETF with discretionary/active management has Goodhart's Law risk:
# the manager's incentives (AUM stability, tracking error minimization) may diverge
# from the holder's thesis over time. This file defines the quarterly monitoring
# framework for each thematic ETF position.
#
# Cost: ~15 minutes per position per quarter pulling holdings from etf.com.
# Benefit: catch thesis drift before it costs real money.

