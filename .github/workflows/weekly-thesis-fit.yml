name: Weekly Thesis-Fit Scan

on:
  schedule:
    # Sundays 8pm PT = Mondays 03:00 UTC (PDT) / 04:00 UTC (PST)
    # Mid-Mar → early Nov: use 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run thesis-fit scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/thesis_fit.py

      - name: Commit results
        run: |
          git config user.name  "portfolio-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add discover/
          if git diff --cached --quiet; then
            echo "No new thesis-fit output."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "thesis-fit: ${DATE}"
          git push
