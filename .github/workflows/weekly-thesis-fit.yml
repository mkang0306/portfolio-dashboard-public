name: Weekly Thesis-Fit Scan

on:
  schedule:
    # Sundays 8pm PT = Mondays 03:00 UTC (PDT) / 04:00 UTC (PST)
    # Mid-Mar → early Nov: use 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Personal portfolio data is gitignored (cost basis). Materialize it from
      # encrypted repo secrets at runtime. base64-encoded to survive YAML/newlines.
      # Files are written into the gitignored data/ dir, so the commit step below
      # (which only adds discover/) never persists them to git history.
      - name: Write portfolio data from secrets
        env:
          HOLDINGS_YAML_B64: ${{ secrets.HOLDINGS_YAML_B64 }}
          THESIS_MD_B64: ${{ secrets.THESIS_MD_B64 }}
          DECLINED_YAML_B64: ${{ secrets.DECLINED_YAML_B64 }}
        run: |
          mkdir -p data
          if [ -z "$HOLDINGS_YAML_B64" ] || [ -z "$THESIS_MD_B64" ]; then
            echo "Required secrets HOLDINGS_YAML_B64 / THESIS_MD_B64 are not set." >&2
            exit 1
          fi
          printf '%s' "$HOLDINGS_YAML_B64" | base64 -d > data/holdings.yaml
          printf '%s' "$THESIS_MD_B64"     | base64 -d > data/thesis.md
          if [ -n "$DECLINED_YAML_B64" ]; then
            printf '%s' "$DECLINED_YAML_B64" | base64 -d > data/declined.yaml
          fi

      - name: Run thesis-fit scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/thesis_fit.py

      - name: Commit results
        run: |
          git config user.name  "portfolio-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add discover/
          if git diff --cached --quiet; then
            echo "No new thesis-fit output."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "thesis-fit: ${DATE}"
          git push
